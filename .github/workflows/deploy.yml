name: Test and deploy Berthday
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      reseed:
        description: "Wipe berthday and reload the legacy seed"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: berthday-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r migration/requirements.txt
      - name: Golden migration and seed safeguards
        run: python -m pytest -q migration/tests
      - run: npm ci
      - run: npm run typecheck
      - name: Domain, parity, Worker API, and D1 provisioning tests
        run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with: { name: berthday-seed, path: migration/out/seed.sql, if-no-files-found: error }

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CI: "true"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
      FORCE_RESEED: ${{ inputs.reseed || false }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: actions/download-artifact@v4
        with: { name: berthday-seed, path: migration/out }
      - run: node scripts/ci/ensure-d1.mjs
      - run: npx wrangler d1 migrations apply berthday --remote
      - run: bash scripts/ci/seed-if-empty.sh
      - run: npm run build
      - name: Deploy Berthday
        run: npx wrangler deploy --var APP_VERSION:${GITHUB_SHA::7} | tee deploy.log
      - name: Smoke test Berthday
        run: |
          URL=$(grep -oE 'https://berthday\.[a-zA-Z0-9-]+\.workers\.dev' deploy.log | head -1)
          test -n "$URL"
          bash scripts/ci/smoke-test.sh "$URL" "${GITHUB_SHA::7}"
          echo "Berthday deployed to $URL" >> "$GITHUB_STEP_SUMMARY"
